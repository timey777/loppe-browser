# 窗口外框 —— 宿主画在客户区最外圈的一条线，只影响窗口那圈边，标签页内容不受影响。
# 阴影和圆角不在这里：Windows 上是系统的 DWM 给的（见 src/platform/window_frame.cpp），
# 这里只补系统给不了的那条边界线。
#
# 什么时候生效：启动时读一次（改完重启）。

# style：
#   line   一圈圆角描边 + 内侧 1px 高光（默认）
#   none   不画，只靠系统阴影分界
style    = line

# 描边宽度（dp）。1 = 最细的一条；超过 2 就开始显得钝
width    = 1

# 圆角半径（dp）。Win11 上系统自己裁圆角，这里只影响那条线怎么拐弯，跟系统圆角对齐即可。
# 最大化时描边不画（贴屏幕边，交回系统）。
radius   = 10
