# 本地映射表 —— 地址栏输入左边的名字，直接连到右边的地址。
#
# 格式：  别名 = 主机[:端口]      端口不写 = 80
#
# 什么时候生效：
#   解析模式「自动」（默认）  命中这张表就用它，没命中交给 DNS
#   解析模式「本地映射」      只查这张表，查不到就报错
#   解析模式「域名」          这张表完全不参与
#
# 改完不用重启：每次按回车导航都会重新读这张表。

# 本机开发入口 —— 地址栏输入 loppe 就到这里
# 起演示服务（在仓库根执行）：python -m http.server 8080 --directory examples
loppe = 127.0.0.1:8080

# 想真的走 80 端口就把端口去掉（服务要真的监听 80，Windows 上通常要管理员）
# loppe = 127.0.0.1

# 局域网里的另一台机器
# nas = 192.168.1.20
